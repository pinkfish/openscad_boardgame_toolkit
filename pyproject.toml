[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openscad-boardgame-toolkit"
version = "0.1.0"
description = "Board game insert toolkit for OpenSCAD / PythonSCAD"
requires-python = ">=3.10"
dependencies = [
    "pybosl2",
    "numpy",
]
authors = [{ name = "pinkfish" }]

[project.optional-dependencies]
scripts = [
    "pybosl2",
    "pymeshlab",
    "lark",
    "hyperpack",
    "inkex",
    "numpy",
    "svgelements",
    "simplepath",
]

[tool.setuptools.packages.find]
include = []

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
quote-style = "double"
