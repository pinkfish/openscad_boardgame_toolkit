[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openscad-boardgame-toolkit"
version = "0.1.0"
description = "Board game insert toolkit for OpenSCAD / PythonSCAD"
requires-python = ">=3.10"
dependencies = [
    # 0.7.7 or newer: path fixes, the Color class, Region.even_odd, and the SVG loader speed fix
    # (shapes.py loads drawings via Region.from_svg; 0.7.6 takes 196s on one file). Path2D/Path3D default to
    # closed=False there (so every outline meant as a polygon passes closed=True explicitly),
    # Path.tangents returns one tangent per point, and smooth_path/round_corners match BOSL2.
    # On 0.7.1 the box outlines silently lose their closing edge and the lids round wrong.
    "pybosl2>=0.7.7",
    "numpy",
]
authors = [{ name = "pinkfish" }]

[project.optional-dependencies]
scripts = [
    "pybosl2>=0.7.7",
    "pymeshlab",
    "lark",
    "hyperpack",
    "inkex",
    "numpy",
    "svgelements",
    "simplepath",
]

[tool.setuptools.packages.find]
include = []

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
quote-style = "double"
