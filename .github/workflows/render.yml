name: render

on:
  push:
  pull_request:

jobs:
  render:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pybosl2 numpy pymeshlab fpdf2 pillow

      - name: Locate PythonSCAD binary
        id: pythonscad
        run: |
          for p in "/Applications/PythonSCAD-dev.app/Contents/MacOS/PythonSCAD" \
                   "/Applications/PythonSCAD.app/Contents/MacOS/PythonSCAD"; do
            if [ -x "$p" ]; then
              echo "PYTHONSCAD_BIN=$p" >> "$GITHUB_ENV"
              echo "found=yes" >> "$GITHUB_OUTPUT"
              break
            fi
          done

      - name: Run golden-image render tests
        if: steps.pythonscad.outputs.found == 'yes'
        env:
          PYTHONSCAD_BIN: ${{ env.PYTHONSCAD_BIN }}
        run: python -m pytest tests/test_spec_driven/render/ -q

      - name: Report missing binary
        if: steps.pythonscad.outputs.found != 'yes'
        run: echo "PythonSCAD binary not present — render tests skipped"
