name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pybosl2 numpy pymeshlab fpdf2

      - name: Run fast pure-Python tests
        run: python -m pytest tests/test_spec_driven/ -q

      - name: Type check with pyright
        run: |
          npx --yes pyright spec_driven/ --outputjson || true
