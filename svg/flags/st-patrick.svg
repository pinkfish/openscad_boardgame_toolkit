<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480">
  <!-- St Patrick's Saltire. NOT part of flag-icons (it is a component of the Union Jack
       rather than a flag any country flies today), so unlike its neighbours here this one is
       drawn by hand: a red saltire on white, at the Union Jack's 1/3 arm width. -->
  <path fill="#fff" d="M0 0h640v480H0z"/>
  <path fill="#cf142b" d="M0 0h80l560 420v60h-80L0 60z"/>
  <path fill="#cf142b" d="M640 0v60L80 480H0v-60L560 0z"/>
</svg>
